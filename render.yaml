services:
  - type: web
    name: agaueditions-laravel
    runtime: docker
    plan: free
    branch: feature/agent-ia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: AGENT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: file

  - type: web
    name: agaueditions-agent
    runtime: python
    plan: free
    branch: feature/agent-ia
    rootDir: agent-ia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: MODEL
        sync: false
      - key: LARAVEL_URL
        sync: false